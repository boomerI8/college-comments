<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔒</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container" style="max-width: 900px;">
    
    <!-- Login Form -->
    <div id="loginSection" class="card">
      <h2 style="margin-bottom: 16px;">Admin Access</h2>
      <form id="loginForm">
        <input type="email" id="adminEmail" placeholder="Admin Email" required>
        <input type="password" id="adminPassword" placeholder="Password" required>
        <div id="loginAlert" class="alert"></div>
        <button type="submit" id="loginBtn">Login</button>
      </form>
    </div>

    <!-- Admin Panel (Hidden until authenticated) -->
    <div id="adminPanel" class="hidden">
      <div class="admin-header">
        <h2>All Submitted Comments</h2>
        <button id="logoutBtn" class="btn-logout">Logout</button>
      </div>

      <div class="card" style="padding: 12px; margin-bottom: 16px;">
        <input type="text" id="searchInput" placeholder="Search by recipient name, department, or comment..." style="margin-bottom: 0;">
      </div>

      <div class="card" style="padding: 0; overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Recipient Name</th>
              <th>Department</th>
              <th>Comment</th>
              <th>Date / Time</th>
              <th>Anonymous Author ID</th>
            </tr>
          </thead>
          <tbody id="adminTableBody">
            <tr>
              <td colspan="5" style="text-align: center; color: var(--text-muted);">Loading comments...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
